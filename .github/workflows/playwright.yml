name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Google Authentication Test First
      run: npx playwright test e2eTest/googleAuthentication.spec.js --project=chromium --disable-features=site-per-process --disable-blink-features=AutomationControlled --no-sandbox --disable-setuid-sandbox --disable-gpu --disable-dev-shm-usage

    - name: Run Main Test file
      run: npx playwright test e2eTest/main.spec.js --trace on-first-retry --project=chromium

    - name: Upload Test Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
